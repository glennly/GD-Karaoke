name: Build GD Karaoke Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Generate Android Flutter project files
        run: flutter create --platforms=android --org com.glennly --project-name gd_karaoke --no-pub .

      - name: Get packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GD-Karaoke-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
